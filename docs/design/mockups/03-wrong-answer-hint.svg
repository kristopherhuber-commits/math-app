">$48.00</text><rect x="568" y="280" width="220" height="108" rx="18" fill="#FFFFFF" stroke="#E4DACA" stroke-width="2" opacity="1"/><text x="678.0" y="346.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#1B2B3A" text-anchor="middle" opacity="1">$60.00</text><rect x="96" y="404" width="220" height="108" rx="18" fill="#FFFFFF" stroke="#E4DACA" stroke-width="2" opacity="1"/><text x="206.0" y="470.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#1B2B3A" text-anchor="middle" opacity="1">$40.00</text><rect x="332" y="404" width="220" height="108" rx="18" fill="#FFFFFF" stroke="#E4DACA" stroke-width="2" opacity="1"/><text x="442.0" y="470.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#1B2B3A" text-anchor="middle" opacity="1">$52.00</text><rect x="96" y="540" width="440" height="56" rx="16" fill="#FDEBD3" opacity="1"/><text x="120" y="575" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#9A4A06" text-anchor="start" opacity="1">Not quite. That's the same as the start price.</text><circle cx="96" cy="540" r="13" fill="#7C3AED"/><text x="96" y="545" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text><rect x="96" y="628" width="200" height="56" rx="14" fill="#E9F4E4" stroke="#5E9E4C" stroke-width="2" opacity="1"/><g transform="translate(134,658.0) scale(0.28)"><ellipse cx="-38" cy="30" rx="14" ry="9" fill="#5E9E4C"/><ellipse cx="34" cy="32" rx="14" ry="9" fill="#5E9E4C"/><ellipse cx="0" cy="8" rx="52" ry="36" fill="#3F7432"/><ellipse cx="0" cy="4" rx="46" ry="30" fill="#7DB86A"/><polygon points="-9,0 -4,-8 4,-8 9,0 4,8 -4,8" fill="#9CCB88" opacity="0.9"/><polygon points="-33,6 -28,-2 -20,-2 -15,6 -20,14 -28,14" fill="#9CCB88" opacity="0.9"/><polygon points="15,6 20,-2 28,-2 33,6 28,14 20,14