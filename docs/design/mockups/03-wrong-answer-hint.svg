% means × 1.20.</text><text x="892" y="362" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="start" opacity="1">$50.00 × 1.20 = ?</text><text x="892" y="392" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="start" opacity="1"></text><text x="892" y="422" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="start" opacity="1">Step 2: down 20% is 20% of that</text><text x="892" y="452" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="start" opacity="1">new, bigger price, not of $50.</text><text x="892" y="482" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="start" opacity="1">So multiply by 0.80.</text><circle cx="872" cy="236" r="13" fill="#7C3AED"/><text x="872" y="241" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><rect x="872" y="560" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#E4DACA" stroke-width="2" opacity="1"/><text x="1032.0" y="592.3" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#1B2B3A" text-anchor="middle" opacity="1">Show me step by step</text><text x="1032" y="648" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2F5E24" text-anchor="middle" opacity="1">Walkthrough = 1 star, and that's OK!</text><text x="1032" y="684" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2F5E24" text-anchor="middle" opacity="1">Close hint  ✕</text></svg>